<!doctype html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<meta name='theme-color' content='#304d3d'>
<title>방문 안내 | 공방마당 작은장터</title>
<style>
:root{
  --bg:#f6f3ec;
  --paper:#fffdf8;
  --ink:#181818;
  --muted:#687068;
  --line:#e1ddd2;
  --green:#304d3d;
  --green2:#3a5e4b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.frame{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(0,0,0,.06);overflow:hidden}
.header{height:72px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,253,248,.96);position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(0,0,0,.04);backdrop-filter:saturate(160%) blur(10px)}
.logo-wrap img{width:152px;height:auto}
.visit-link{font-size:12px;font-weight:800;letter-spacing:.08em;padding-bottom:3px;border-bottom:1px solid currentColor}
.hero{position:relative;height:min(112vw,560px);background:#d9d9d9}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 58%}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.05) 34%,rgba(0,0,0,.42) 76%,rgba(0,0,0,.68))}
.hero-copy{position:absolute;z-index:2;left:24px;right:24px;bottom:26px;color:#fff}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.9}
.hero h1{margin:12px 0 6px;font-size:58px;line-height:1.02;letter-spacing:-.08em;font-weight:900}
.hero h1 .block{display:block}
.hero-meta{margin-top:16px;display:grid;gap:7px;font-size:14px;font-weight:700}
.ribbon{display:grid;grid-template-columns:1fr 1fr;background:var(--green);color:#fff}
.ribbon .item{padding:18px 22px}
.ribbon .item + .item{border-left:1px solid rgba(255,255,255,.18)}
.ribbon .label{display:block;font-size:10px;letter-spacing:.15em;opacity:.7;margin-bottom:8px;font-weight:700}
.ribbon strong{font-size:16px;line-height:1.5;letter-spacing:-.03em}
.intro{padding:54px 26px 44px;text-align:center}
.intro .mini{font-size:11px;font-weight:900;letter-spacing:.16em;color:#74826f}
.intro h2{font-size:35px;line-height:1.38;letter-spacing:-.08em;margin:14px 0 18px}
.intro p{margin:0;color:var(--muted);font-size:15px;line-height:1.9}
.rule{height:1px;background:var(--line);margin:0 24px}
.section{padding:42px 24px 0}
.section .mini{font-size:11px;font-weight:900;letter-spacing:.18em;color:#74826f}
.section h2{margin:10px 0 8px;font-size:31px;letter-spacing:-.07em;line-height:1.25}
.section .sub{font-size:15px;color:#5a645c;line-height:1.75;margin:0 0 22px;font-weight:600}
.gallery{display:grid;grid-template-columns:1.08fr .92fr;gap:8px}
.gallery .left img{height:340px;object-fit:cover;border-radius:18px;object-position:center center}
.gallery .right{display:grid;grid-template-rows:1fr 1fr;gap:8px}
.gallery .right img{height:166px;object-fit:cover;border-radius:18px}
.img-top{object-position:35% 50%}
.img-bottom{object-position:60% 50%}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{display:flex;justify-content:center;align-items:center;text-align:center;padding:16px 14px;border-radius:14px;font-size:14px;font-weight:800;min-height:56px}
.btn.dark{background:var(--green);color:#fff}
.btn.light{background:#fff;border:1px solid #cfd5cd;color:#244032}
.workshop{padding:56px 24px 0}
.workshop-card{background:#eef0e7;border-radius:24px;overflow:hidden}
.workshop-card .photo{width:100%;height:285px;object-fit:cover;object-position:center 48%}
.workshop-body{padding:22px 22px 24px}
.workshop-body .mini{font-size:11px;font-weight:900;letter-spacing:.18em;color:#74826f}
.workshop-body h2{margin:6px 0 12px;font-size:29px;line-height:1.28;letter-spacing:-.07em}
.workshop-body p{margin:0 0 16px;color:#59645e;font-size:14px;line-height:1.9}
.stack-photo{width:100%;height:250px;object-fit:cover;object-position:center 45%;border-radius:18px;margin-top:12px}
.info{padding:56px 24px 0}
.info-card{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:flex;gap:14px;padding:16px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .label{width:74px;flex:0 0 74px;color:#708070;font-size:12px;font-weight:800;padding-top:3px}
.row .value{font-size:15px;line-height:1.7;font-weight:700;letter-spacing:-.02em}
.footer-invite{margin-top:56px;background:#22392c;color:#fff;padding:46px 26px 96px;text-align:center}
.footer-invite .small{font-size:15px;line-height:1.85;opacity:.95;margin:0 0 10px}
.footer-invite .main{font-size:20px;line-height:1.75;letter-spacing:-.04em;font-weight:700;margin:0}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;max-width:520px;margin:0 auto;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.sticky a,.sticky button{border:0;padding:17px 10px;font:inherit;font-size:14px;font-weight:800}
.sticky .share{background:#fff;color:#203629}
.sticky .visit{background:var(--green);color:#fff}
.page-head{padding:50px 24px 28px}
.page-head .mini{font-size:11px;font-weight:900;letter-spacing:.18em;color:#74826f}
.page-head h1{margin:10px 0 12px;font-size:34px;line-height:1.24;letter-spacing:-.08em}
.page-head p{margin:0;color:#5e675f;font-size:15px;line-height:1.9}
.invite-card,.visit-card{margin:0 24px 18px;background:#f1f2eb;border-radius:22px;padding:24px}
.invite-card h2,.visit-card h2{margin:0 0 12px;font-size:24px;letter-spacing:-.06em}
.invite-card p,.visit-card p{margin:0;color:#5b655d;line-height:1.9;font-size:14px}
.copy-box{margin-top:16px;background:#fff;border:1px solid #d8ddd6;border-radius:16px;padding:18px;font-size:14px;line-height:1.8;color:#22342a;white-space:pre-line}
.button-stack{display:grid;gap:10px;margin:18px 24px 0}
.return{display:block;text-align:center;font-size:13px;font-weight:800;margin:22px auto 92px;width:max-content;border-bottom:1px solid currentColor;padding-bottom:4px}
@media (min-width:521px){.sticky{border-radius:14px 14px 0 0;overflow:hidden}}
</style>
</head>
